name: Build OnePlus 8T ColorOS 13 ReSukiSU + SuSFS Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build Kernel for OnePlus 8T (kebab)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 10G /swapfile || true
            sudo chmod 600 /swapfile || true
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
          fi
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git ccache automake flex lzop bison build-essential zip curl \
            bc libssl-dev libelf-dev libfl-dev python3 device-tree-compiler \
            cpio zstd binutils p7zip-full dwarves patch

          curl -s -L http://launchpadlibrarian.net/580830584/libtinfo5_6.3-2_amd64.deb -o libtinfo5.deb || true
          if [ -f libtinfo5.deb ]; then
            sudo dpkg -i libtinfo5.deb || true
            rm -f libtinfo5.deb
          fi

          sudo rm -f /usr/bin/python
          sudo ln -s /usr/bin/python3 /usr/bin/python

      - name: Download toolchains
        run: |
          cd $GITHUB_WORKSPACE
          echo "Cloning GCC 4.9 toolchains..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git -b android12L-release gcc-64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git -b android12L-release gcc-32

          echo "Downloading ZyCromerZ Clang 10.0.1 (ColorOS 13 Kernel Certified)..."
          curl -s -L "https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz" -o clang-custom.tar.gz
          mkdir -p clang-custom
          tar -xzf clang-custom.tar.gz -C clang-custom/
          rm -f clang-custom.tar.gz

      - name: Clone kernel source
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b bpf-5.15-backport https://github.com/toraidl/android_kernel_oneplus_sm8250.git device_kernel

      - name: Integrate SuSFS, ReSukiSU & Syscall Hooks
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "1. Cloning susfs4ksu 4.19 patchset..."
          git clone --depth=1 -b kernel-4.19 https://github.com/ShirkNeko/susfs4ksu.git susfs_src
          echo "Copying SuSFS source files to kernel..."
          cp -f susfs_src/kernel_patches/fs/susfs.c fs/
          cp -f susfs_src/kernel_patches/fs/sus_su.c fs/ || true
          cp -f susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cp -f susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/
          cp -f susfs_src/kernel_patches/include/linux/sus_su.h include/linux/ || true

          echo "Applying 50_add_susfs_in_kernel-4.19.patch..."
          patch -p1 --forward --ignore-whitespace < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          grep -q "CONFIG_KSU_SUSFS" fs/Makefile || echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile

          echo "Fixing SuSFS headers and structures..."
          # Fix TASK_STRUCT_NON_ROOT_USER_APP_PROC definition in susfs_def.h
          if ! grep -q "TASK_STRUCT_NON_ROOT_USER_APP_PROC" include/linux/susfs_def.h; then
            sed -i '/#define INODE_STATE_OPEN_REDIRECT/a\#define TASK_STRUCT_NON_ROOT_USER_APP_PROC BIT(24)' include/linux/susfs_def.h
          fi

          # Fix susfs_task_state inside task_struct in include/linux/sched.h
          if ! grep -q "susfs_task_state" include/linux/sched.h; then
            sed -i '/randomized_struct_fields_end/i\#if defined(CONFIG_KSU_SUSFS)\n\tu64 susfs_task_state;\n\tu64 susfs_last_fake_mnt_id;\n#endif' include/linux/sched.h
          fi

          # Fix namespace.c missing Hunk #1 definitions
          if ! grep -q "susfs_mnt_id_ida" fs/namespace.c; then
            python3 -c "
with open('fs/namespace.c', 'r') as f:
    content = f.read()
target = '#include \"internal.h\"'
inject = '''#include \"internal.h\"

#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)
#include <linux/susfs_def.h>
#endif

#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
extern bool susfs_is_current_ksu_domain(void);
extern bool susfs_is_current_zygote_domain(void);

static DEFINE_IDA(susfs_mnt_id_ida);
static DEFINE_IDA(susfs_mnt_group_ida);

#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */
#endif
'''
if target in content:
    content = content.replace(target, inject, 1)
    with open('fs/namespace.c', 'w') as f:
        f.write(content)
    print('fs/namespace.c successfully patched!')
"
          fi

          echo "2. Injecting ReSukiSU driver..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main

          echo "3. Injecting non-GKI 4.19 syscall hooks..."
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/syscall_hook_patches.sh" | bash -s

          echo "4. Spoofing Stock Version to 4.19.157-perf+..."
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 157/' Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile

          echo "5. Applying OnePlus defconfig & SuSFS flags..."
          DEFCONFIG="arch/arm64/configs/vendor/kona-perf_defconfig"
          sed -i '$a\CONFIG_TECHPACK_CAMERA_ONEPLUS=y' $DEFCONFIG
          sed -i '/-include oplus_native_features.mk/i\export BRAND_SHOW_FLAG=oneplus' OplusKernelEnvConfig.mk

          # Disable problematic BTF debugging
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/# CONFIG_DEBUG_INFO_BTF is not set/g' $DEFCONFIG
          echo "CONFIG_DEBUG_INFO_BTF=n" >> $DEFCONFIG

          # Ensure exact localversion
          sed -i '/CONFIG_LOCALVERSION/d' $DEFCONFIG
          echo 'CONFIG_LOCALVERSION="-perf+"' >> $DEFCONFIG
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> $DEFCONFIG

          # Enable KSU & SuSFS flags
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $DEFCONFIG

      - name: Build Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH

          # Stock build environment spoofing (matches user screenshot)
          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="dg02-pool06-kvm44"
          export KBUILD_BUILD_VERSION="1"
          export KBUILD_BUILD_TIMESTAMP="Wed Feb 21 19:12:51 CST 2024"

          make O=out ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            BRAND_SHOW_FLAG=oneplus \
            NM=llvm-nm \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CONFIG_TECHPACK_CAMERA_ONEPLUS=y \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- \
            vendor/kona-perf_defconfig

          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            BRAND_SHOW_FLAG=oneplus \
            NM=llvm-nm \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CONFIG_TECHPACK_CAMERA_ONEPLUS=y \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- \
            Image dtbs

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git Anykernel3

          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh

          mkdir -p tmp
          cp -fp out/arch/arm64/boot/Image tmp/
          if [ -f out/arch/arm64/boot/dtb ]; then
            cp -fp out/arch/arm64/boot/dtb tmp/
          fi
          cp -rp Anykernel3/* tmp/
          cd tmp
          zip -r9 $GITHUB_WORKSPACE/OnePlus8T-ColorOS13-ReSukiSU-AK3.zip * -x .git README.md *placeholder
          cd $GITHUB_WORKSPACE

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-ColorOS13-ReSukiSU-AK3
          path: OnePlus8T-ColorOS13-ReSukiSU-AK3.zip
